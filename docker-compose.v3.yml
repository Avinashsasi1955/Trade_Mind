services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: nivesh
      POSTGRES_USER: nivesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nivesh-local-paper-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres/v3_0_production.sql:/docker-entrypoint-initdb.d/001-v3.sql:ro
      - ./migrations/postgres/v3_1_application.sql:/docker-entrypoint-initdb.d/002-app.sql:ro
      - ./migrations/postgres/v3_2_research_runtime.sql:/docker-entrypoint-initdb.d/003-research.sql:ro
      - ./migrations/postgres/v3_3_shadow_sessions.sql:/docker-entrypoint-initdb.d/004-shadow.sql:ro
      - ./migrations/postgres/v3_4_promotion_engine.sql:/docker-entrypoint-initdb.d/005-promotion.sql:ro
      - ./migrations/postgres/v3_5_security.sql:/docker-entrypoint-initdb.d/006-security.sql:ro
      - ./migrations/postgres/v3_6_live_paper_pipeline.sql:/docker-entrypoint-initdb.d/007-live-paper.sql:ro
      - ./migrations/postgres/v3_7_release_operations.sql:/docker-entrypoint-initdb.d/008-release-operations.sql:ro
      - ./migrations/postgres/v3_8_model_policy_evidence.sql:/docker-entrypoint-initdb.d/009-model-policy-evidence.sql:ro
      - ./migrations/postgres/v3_9_market_data_providers.sql:/docker-entrypoint-initdb.d/010-market-data-providers.sql:ro
      - ./migrations/postgres/v3_10_shadow_session_pnl.sql:/docker-entrypoint-initdb.d/011-shadow-session-pnl.sql:ro
      - ./migrations/postgres/v3_11_paper_trade_lifecycle.sql:/docker-entrypoint-initdb.d/012-paper-trade-lifecycle.sql:ro
      - ./migrations/postgres/v3_12_model_quality_feedback.sql:/docker-entrypoint-initdb.d/013-model-quality-feedback.sql:ro
      - ./migrations/postgres/v3_13_upstox_option_chain_oi.sql:/docker-entrypoint-initdb.d/014-upstox-option-chain-oi.sql:ro
      - ./migrations/postgres/v3_14_adaptive_trade_intelligence.sql:/docker-entrypoint-initdb.d/015-adaptive-trade-intelligence.sql:ro
      - ./migrations/postgres/v3_15_validation_auditability.sql:/docker-entrypoint-initdb.d/016-validation-auditability.sql:ro
      - ./migrations/postgres/v3_16_one_second_candles.sql:/docker-entrypoint-initdb.d/017-one-second-candles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivesh -d nivesh"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  redis:
    image: redis:8.0.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-nivesh-local-paper-only}"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nivesh-local-paper-only}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: postgres:17.5-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-nivesh-local-paper-only}
    volumes:
      - ./migrations/postgres/v3_6_live_paper_pipeline.sql:/migrations/v3_6.sql:ro
      - ./migrations/postgres/v3_7_release_operations.sql:/migrations/v3_7.sql:ro
      - ./migrations/postgres/v3_8_model_policy_evidence.sql:/migrations/v3_8.sql:ro
      - ./migrations/postgres/v3_9_market_data_providers.sql:/migrations/v3_9.sql:ro
      - ./migrations/postgres/v3_10_shadow_session_pnl.sql:/migrations/v3_10.sql:ro
      - ./migrations/postgres/v3_11_paper_trade_lifecycle.sql:/migrations/v3_11.sql:ro
      - ./migrations/postgres/v3_12_model_quality_feedback.sql:/migrations/v3_12.sql:ro
      - ./migrations/postgres/v3_13_upstox_option_chain_oi.sql:/migrations/v3_13.sql:ro
      - ./migrations/postgres/v3_14_adaptive_trade_intelligence.sql:/migrations/v3_14.sql:ro
      - ./migrations/postgres/v3_15_validation_auditability.sql:/migrations/v3_15.sql:ro
      - ./migrations/postgres/v3_16_one_second_candles.sql:/migrations/v3_16.sql:ro
    command: ["sh", "-c", "psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_6.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_7.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_8.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_9.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_10.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_11.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_12.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_13.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_14.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_15.sql && psql -h postgres -U nivesh -d nivesh -v ON_ERROR_STOP=1 -f /migrations/v3_16.sql"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  web:
    image: nivesh-ai:paper-v3.9
    build: .
    command: ["uvicorn", "backend.asgi:app", "--host", "0.0.0.0", "--port", "4173", "--workers", "2", "--no-server-header", "--no-proxy-headers"]
    ports: ["127.0.0.1:4173:4173"]
    environment:
      NIVESH_ENV: development
      NIVESH_HOST: 0.0.0.0
      NIVESH_PORT: 4173
      NIVESH_DEMO_MODE: 1
      NIVESH_LIVE_TRADING_ENABLED: 0
      LIVE_ELIGIBLE: "FALSE"
      DATABASE_URL: postgresql+psycopg2://nivesh:${POSTGRES_PASSWORD:-nivesh-local-paper-only}@postgres:5432/nivesh
      REDIS_URL: redis://:${REDIS_PASSWORD:-nivesh-local-paper-only}@redis:6379/0
      NIVESH_SECRET: ${NIVESH_SECRET:-local-paper-session-secret-not-for-production}
      NIVESH_MODEL_ARTIFACT_KEY: ${NIVESH_MODEL_ARTIFACT_KEY:-local-paper-model-key-not-for-production}
      NIVESH_REQUIRE_SIGNED_MODEL: ${NIVESH_REQUIRE_SIGNED_MODEL:-1}
      NIVESH_BROKER_SESSION_KEY: ${NIVESH_BROKER_SESSION_KEY:-local-paper-broker-key-not-for-production}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      NIVESH_MARKET_DATA_PROVIDER: ${NIVESH_MARKET_DATA_PROVIDER:-zerodha}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/llama-3.3-nemotron-super-49b-v1.5}
      NIVESH_NEWS_PROVIDER: ${NIVESH_NEWS_PROVIDER:-newsapi}
      NIVESH_NEWS_API_BASE_URL: ${NIVESH_NEWS_API_BASE_URL:-https://newsapi.org/v2/everything}
      NIVESH_NEWS_API_KEY: ${NIVESH_NEWS_API_KEY:-}
      NIVESH_NEWS_API_KEY_HEADER: ${NIVESH_NEWS_API_KEY_HEADER:-X-Api-Key}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_NEWS_LOOKBACK_DAYS: ${FINNHUB_NEWS_LOOKBACK_DAYS:-7}
      FINNHUB_NEWS_CATEGORY: ${FINNHUB_NEWS_CATEGORY:-general}
      FINNHUB_NEWS_TIMEOUT_SECONDS: ${FINNHUB_NEWS_TIMEOUT_SECONDS:-8}
      NIVESH_NEWS_SCAN_SYMBOL_LIMIT: ${NIVESH_NEWS_SCAN_SYMBOL_LIMIT:-50}
      NIVESH_NEWS_SYMBOLS: ${NIVESH_NEWS_SYMBOLS:-}
      FINNHUB_WEBHOOK_URL: ${FINNHUB_WEBHOOK_URL:-}
      FINNHUB_WEBHOOK_SECRET: ${FINNHUB_WEBHOOK_SECRET:-}
      NIVESH_MIN_SESSION_PAPER_TRADES: ${NIVESH_MIN_SESSION_PAPER_TRADES:-1}
      NIVESH_SHADOW_MIN_OPTION_GRADE: ${NIVESH_SHADOW_MIN_OPTION_GRADE:-B}
      NIVESH_SHADOW_OPTION_GRADE_A_SCORE: ${NIVESH_SHADOW_OPTION_GRADE_A_SCORE:-78}
      NIVESH_SHADOW_OPTION_GRADE_B_SCORE: ${NIVESH_SHADOW_OPTION_GRADE_B_SCORE:-68}
    volumes:
      - ./index.html:/app/index.html
      - ./styles.css:/app/styles.css
      - ./app.js:/app/app.js
      - ./backend:/app/backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4173/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  stream:
    profiles: ["live-paper"]
    image: nivesh-ai:paper-v3.9
    command: ["python", "-m", "backend.live_stream_service"]
    environment:
      DATABASE_URL: postgresql+psycopg2://nivesh:${POSTGRES_PASSWORD:-nivesh-local-paper-only}@postgres:5432/nivesh
      REDIS_URL: redis://:${REDIS_PASSWORD:-nivesh-local-paper-only}@redis:6379/0
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      NIVESH_MARKET_DATA_PROVIDER: ${NIVESH_MARKET_DATA_PROVIDER:-zerodha}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
      UPSTOX_INSTRUMENTS_URL: ${UPSTOX_INSTRUMENTS_URL:-https://assets.upstox.com/market-quote/instruments/exchange/complete.json.gz}
      NIVESH_UPSTOX_FULL_MODE_LIMIT: ${NIVESH_UPSTOX_FULL_MODE_LIMIT:-500}
      NIVESH_UPSTOX_TOTAL_KEY_LIMIT: ${NIVESH_UPSTOX_TOTAL_KEY_LIMIT:-2000}
      NIVESH_1S_RETENTION_DAYS: ${NIVESH_1S_RETENTION_DAYS:-30}
      NIVESH_LIVE_TRADING_ENABLED: 0
      LIVE_ELIGIBLE: "FALSE"
      NIVESH_KITE_FULL_MODE_LIMIT: ${NIVESH_KITE_FULL_MODE_LIMIT:-2500}
      NIVESH_KITE_TOTAL_TOKEN_LIMIT: ${NIVESH_KITE_TOTAL_TOKEN_LIMIT:-9000}
      NIVESH_GAP_BACKFILL_LIMIT: ${NIVESH_GAP_BACKFILL_LIMIT:-20}
    volumes:
      - ./backend:/app/backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    image: nivesh-ai:paper-v3.9
    command: ["celery", "-A", "backend.tasks.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1"]
    environment:
      DATABASE_URL: postgresql+psycopg2://nivesh:${POSTGRES_PASSWORD:-nivesh-local-paper-only}@postgres:5432/nivesh
      REDIS_URL: redis://:${REDIS_PASSWORD:-nivesh-local-paper-only}@redis:6379/0
      NIVESH_LIVE_TRADING_ENABLED: 0
      LIVE_ELIGIBLE: "FALSE"
      NIVESH_MODEL_ARTIFACT_KEY: ${NIVESH_MODEL_ARTIFACT_KEY:-local-paper-model-key-not-for-production}
      NIVESH_REQUIRE_SIGNED_MODEL: ${NIVESH_REQUIRE_SIGNED_MODEL:-1}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      NIVESH_MARKET_DATA_PROVIDER: ${NIVESH_MARKET_DATA_PROVIDER:-zerodha}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      UPSTOX_ANALYTICS_TOKEN: ${UPSTOX_ANALYTICS_TOKEN:-}
      UPSTOX_INSTRUMENTS_URL: ${UPSTOX_INSTRUMENTS_URL:-https://assets.upstox.com/market-quote/instruments/exchange/complete.json.gz}
      NIVESH_AUTO_GAP_REPAIR_ENABLED: ${NIVESH_AUTO_GAP_REPAIR_ENABLED:-1}
      NIVESH_AUTO_GAP_REPAIR_LIMIT: ${NIVESH_AUTO_GAP_REPAIR_LIMIT:-100}
      NIVESH_EOD_REPAIR_BEFORE_REPORT: ${NIVESH_EOD_REPAIR_BEFORE_REPORT:-1}
      NIVESH_EOD_GAP_REPAIR_LIMIT: ${NIVESH_EOD_GAP_REPAIR_LIMIT:-200}
      NIVESH_UPSTOX_OPTION_CHAIN_OI_ENABLED: ${NIVESH_UPSTOX_OPTION_CHAIN_OI_ENABLED:-1}
      NIVESH_UPSTOX_OPTION_CHAIN_LIMIT: ${NIVESH_UPSTOX_OPTION_CHAIN_LIMIT:-8}
      NIVESH_UPSTOX_OPTION_CHAIN_UNDERLYINGS: ${NIVESH_UPSTOX_OPTION_CHAIN_UNDERLYINGS:-NIFTY 50,BANKNIFTY,SENSEX,RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS}
      NIVESH_UPSTOX_OPTION_CHAIN_SLEEP_SECONDS: ${NIVESH_UPSTOX_OPTION_CHAIN_SLEEP_SECONDS:-0.35}
      NIVESH_MIN_SESSION_PAPER_TRADES: ${NIVESH_MIN_SESSION_PAPER_TRADES:-1}
      NIVESH_NEWS_PROVIDER: ${NIVESH_NEWS_PROVIDER:-newsapi}
      NIVESH_NEWS_API_KEY: ${NIVESH_NEWS_API_KEY:-}
      NIVESH_NEWS_API_BASE_URL: ${NIVESH_NEWS_API_BASE_URL:-https://newsapi.org/v2/everything}
      NIVESH_NEWS_API_KEY_HEADER: ${NIVESH_NEWS_API_KEY_HEADER:-X-Api-Key}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_NEWS_LOOKBACK_DAYS: ${FINNHUB_NEWS_LOOKBACK_DAYS:-7}
      FINNHUB_NEWS_CATEGORY: ${FINNHUB_NEWS_CATEGORY:-general}
      FINNHUB_NEWS_TIMEOUT_SECONDS: ${FINNHUB_NEWS_TIMEOUT_SECONDS:-8}
      NIVESH_NEWS_SCAN_SYMBOL_LIMIT: ${NIVESH_NEWS_SCAN_SYMBOL_LIMIT:-50}
      NIVESH_NEWS_SYMBOLS: ${NIVESH_NEWS_SYMBOLS:-}
      FINNHUB_WEBHOOK_URL: ${FINNHUB_WEBHOOK_URL:-}
      FINNHUB_WEBHOOK_SECRET: ${FINNHUB_WEBHOOK_SECRET:-}
      NIVESH_FINBERT_MODEL: ${NIVESH_FINBERT_MODEL:-ProsusAI/finbert}
      NIVESH_FINBERT_REVISION: ${NIVESH_FINBERT_REVISION:-2280066c35926ed43b2719a19c9dc5883146e4b1}
      NIVESH_LIVE_INFERENCE_SYMBOL_LIMIT: ${NIVESH_LIVE_INFERENCE_SYMBOL_LIMIT:-500}
      NIVESH_PAPER_NOTIONAL: ${NIVESH_PAPER_NOTIONAL:-50000}
      NIVESH_PAPER_EXIT_MINUTES: ${NIVESH_PAPER_EXIT_MINUTES:-75}
      NIVESH_PAPER_STOP_LOSS_PCT: ${NIVESH_PAPER_STOP_LOSS_PCT:-0.006}
      NIVESH_PAPER_TAKE_PROFIT_PCT: ${NIVESH_PAPER_TAKE_PROFIT_PCT:-0.012}
      NIVESH_PAPER_OPTION_STOP_LOSS_PCT: ${NIVESH_PAPER_OPTION_STOP_LOSS_PCT:-0.06}
