      NIVESH_SHADOW_OPTION_RECENT_COVERAGE_MINUTES: ${NIVESH_SHADOW_OPTION_RECENT_COVERAGE_MINUTES:-30}
      NIVESH_SHADOW_MIN_OPTION_SESSION_1M_COVERAGE_PCT: ${NIVESH_SHADOW_MIN_OPTION_SESSION_1M_COVERAGE_PCT:-50}
      NIVESH_SHADOW_OPTION_STOP_NOISE_ATR_MULTIPLE: ${NIVESH_SHADOW_OPTION_STOP_NOISE_ATR_MULTIPLE:-1.15}
      NIVESH_SHADOW_MAX_OPTION_LOSS_RUPEES: ${NIVESH_SHADOW_MAX_OPTION_LOSS_RUPEES:-375}
      NIVESH_SHADOW_OPTION_STOP_TO_CAPTURE_MAX_RATIO: ${NIVESH_SHADOW_OPTION_STOP_TO_CAPTURE_MAX_RATIO:-1.50}
      NIVESH_SHADOW_OPTION_MAX_FEE_TO_REWARD_RATIO: ${NIVESH_SHADOW_OPTION_MAX_FEE_TO_REWARD_RATIO:-0.25}
      NIVESH_SHADOW_TOP10_SELECTOR_ENABLED: ${NIVESH_SHADOW_TOP10_SELECTOR_ENABLED:-1}
      NIVESH_SHADOW_MIN_ENTRY_QUALITY: ${NIVESH_SHADOW_MIN_ENTRY_QUALITY:-74}
      NIVESH_SHADOW_MIN_OPTION_ENTRY_QUALITY: ${NIVESH_SHADOW_MIN_OPTION_ENTRY_QUALITY:-68}
