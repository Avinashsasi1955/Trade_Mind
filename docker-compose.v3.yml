      NIVESH_SHADOW_OPTION_MANAGER_PROFIT_LOCK_RUPEES: ${NIVESH_SHADOW_OPTION_MANAGER_PROFIT_LOCK_RUPEES:-250}
      NIVESH_SHADOW_OPTION_MANAGER_MIN_LOCKED_PROFIT_RUPEES: ${NIVESH_SHADOW_OPTION_MANAGER_MIN_LOCKED_PROFIT_RUPEES:-150}
      NIVESH_SHADOW_OPTION_MANAGER_GIVEBACK_PCT: ${NIVESH_SHADOW_OPTION_MANAGER_GIVEBACK_PCT:-0.20}
      NIVESH_SHADOW_MANAGER_TARGET_EXTEND_TRIGGER_PCT: ${NIVESH_SHADOW_MANAGER_TARGET_EXTEND_TRIGGER_PCT:-0.16}
