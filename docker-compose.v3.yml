      NIVESH_SHADOW_ENTRY_CUTOFF_IST: ${NIVESH_SHADOW_ENTRY_CUTOFF_IST:-15:05}
      NIVESH_SHADOW_FORCE_FLAT_IST: ${NIVESH_SHADOW_FORCE_FLAT_IST:-15:20}
      NIVESH_SHADOW_REENTRY_COOLDOWN_MINUTES: ${NIVESH_SHADOW_REENTRY_COOLDOWN_MINUTES:-30}
      NIVESH_SHADOW_MIN_OPTION_PRICE: ${NIVESH_SHADOW_MIN_OPTION_PRICE:-20}
      NIVESH_SHADOW_MAX_OPTION_PRICE: ${NIVESH_SHADOW_MAX_OPTION_PRICE:-450}
      NIVESH_SHADOW_MIN_OPTION_VOLUME: ${NIVESH_SHADOW_MIN_OPTION_VOLUME:-1}
      NIVESH_SHADOW_MIN_OPTION_OI: ${NIVESH_SHADOW_MIN_OPTION_OI:-500}
